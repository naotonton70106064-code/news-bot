name: デプロイのみ

# 記事を生成せず、既にコミット済みの HTML をそのまま GitHub Pages に出す。
# テンプレートや手書きコンテンツを直したあと、Claude API に課金せず反映したいときに使う。
#
# daily.yml / weekly.yml は push では起動しない（schedule と workflow_dispatch のみ）ため、
# push しただけではサイトに反映されない。かつて daily.yml を手動実行して反映させていたが、
# それだと記事収集と要約が一緒に走り、課金が発生し同日の記事が再生成されてしまう。
# このワークフローはその副作用を持たない。
#
# 公開内容は「リポジトリにコミットされている HTML」なので、
# generate_index.py や rebuild_article_pages.py の実行結果は
# あらかじめコミットして push しておく必要がある。

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      # 公開するものだけを _site/ に集めてから配信する。
      #
      # 以前は path: '.' でリポジトリ全体を配信し、templates/ と content/ だけを
      # 退避していた。これは「除外し忘れたものが公開される」構造で、
      # 2026-10-09 時点で以下が意図せず公開されていた:
      #   - articles_backup/ … 484ページ分の重複コンテンツ(SSR移行前のバックアップ)
      #   - すべての .py / CLAUDE.md / requirements.txt / go.bat
      #   - 9月の作業で出た一時ファイル(notes.txt, m5_variance_sample.txt など)
      #   - 0バイトの空ファイル docker(削除済み)
      # 「重複コンテンツ」と「空ページ」はどちらも過去のAdSense不承認理由だった。
      #
      # ホワイトリスト方式にすると、書き忘れたときの結果が「公開されない」になる。
      # 失敗の向きを安全側に倒すのがこの変更の狙い。
      - name: 公開するものだけを _site/ に集める
        run: |
          set -eu
          rm -rf _site
          mkdir -p _site

          # 固定ページと ads.txt。1つでも欠けていたら失敗させる
          for f in index.html about.html contact.html privacy.html ads.txt; do
            test -f "$f"
            cp "$f" _site/
          done

          # 記事とストックコンテンツ。blog/ はまだ無いので存在チェックつき
          for d in articles case-studies blog; do
            if [ -d "$d" ]; then
              cp -R "$d" _site/
            fi
          done

          # 非公開にすべきものが混ざっていないかの最終検査。
          # find の条件を変数に入れてはいけない。展開前にシェルが *.py を
          # カレントディレクトリのファイル名に置き換えてしまい、find が壊れる。
          # そのとき標準出力は空になるので、検査は「黙って通る」。
          # 1回の find の結果を変数に受けて中身の有無で判定する。
          FORBIDDEN=$(find _site \( -name '*.py' -o -name '*.md' -o -name '*.bat' \
            -o -name '.env*' -o -name '*.sql' -o -name 'requirements.txt' \) -print)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::公開対象に非公開ファイルが含まれています"
            echo "$FORBIDDEN"
            exit 1
          fi
          test ! -e _site/articles_backup
          test ! -e _site/templates
          test ! -e _site/content
          test -f _site/index.html
          test -d _site/articles

          echo "公開する直下ファイル:"
          ls -1 _site
          echo "記事HTML: $(find _site/articles -name '*.html' | wc -l) 件"
          for d in case-studies blog; do
            if [ -d "_site/$d" ]; then
              echo "$d: $(find "_site/$d" -name 'index.html' | wc -l) 件"
            fi
          done

      - name: GitHub Pagesのアーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: GitHub Pagesにデプロイ
        id: deployment
        uses: actions/deploy-pages@v4

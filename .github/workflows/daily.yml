name: 毎日ニュース収集

on:
  schedule:
    - cron: '0 19 * * *'  # UTC 19時 = JST 4時
  workflow_dispatch:

jobs:
  collect-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install feedparser anthropic python-dotenv

      - name: ニュース収集・要約実行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: index.htmlを作成
        run: |
          latest=$(ls dashboard_*.html | sort | tail -1)
          cp $latest index.html

      - name: 結果をGitHubにコミット
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add news_*.json dashboard_*.html index.html
          git diff --staged --quiet || git commit -m "ニュース更新: $(date '+%Y-%m-%d')"
          git push

      - name: GitHub Pagesにデプロイ
        uses: actions/deploy-pages@v4
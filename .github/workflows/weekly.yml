name: 週次サマリー生成

on:
  schedule:
    - cron: '0 20 * * 1'  # UTC 20時 = JST 5時（毎週月曜）
  workflow_dispatch:

jobs:
  weekly-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install python-dotenv

      - name: 週次サマリー生成
        run: python weekly.py

      - name: index.htmlを再生成
        run: python generate_index.py

      - name: 結果をGitHubにコミット
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add articles/ index.html
          git diff --staged --quiet || git commit -m "週次サマリー更新: $(date '+%Y-%m-%d')"
          git push

      - name: GitHub Pagesのアーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pagesにデプロイ
        id: deployment
        uses: actions/deploy-pages@v4

name: 週次サマリー生成

on:
  schedule:
    - cron: '0 20 * * 1'  # UTC 20時 = JST 5時（毎週月曜）
  workflow_dispatch:

jobs:
  weekly-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install python-dotenv

      - name: 週次サマリー生成
        run: python weekly.py

      - name: index.htmlを再生成
        run: python generate_index.py

      - name: 結果をGitHubにコミット
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add articles/ index.html
          git diff --staged --quiet || git commit -m "週次サマリー更新: $(date '+%Y-%m-%d')"
          git push

      # templates/ は記事ページ生成用のテンプレート本体で、未置換のプレースホルダが
      # 残った空ページになるため公開しない。リポジトリへのコミット&pushは上のステップで
      # 完了済みなので、ここで作業ツリーから退避してもリポジトリの内容には影響しない。
      - name: 公開対象から templates/ を除外
        run: |
          if [ -d templates ]; then
            mkdir -p "$RUNNER_TEMP/excluded"
            mv templates "$RUNNER_TEMP/excluded/"
          fi
          test ! -e templates
          test -f index.html
          test -d articles
          echo "公開する直下HTML:"
          ls *.html
          echo "公開する記事HTML: $(find articles -name '*.html' | wc -l) 件"

      - name: GitHub Pagesのアーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pagesにデプロイ
        id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- ADSENSE-START -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1944739806788973"
     crossorigin="anonymous"></script>
  <!-- ADSENSE-END -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日のニュース</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #f5f5f5; padding: 2rem; }
    .header { max-width: 800px; margin: 0 auto 2rem; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 20px; font-weight: 600; }
    .date { font-size: 13px; color: #888; }
    .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; overflow: hidden; }
    .card-main { padding: 1.25rem; cursor: pointer; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    .title { font-size: 14px; font-weight: 600; color: #111; line-height: 1.5; }
    .source { font-size: 11px; color: #888; white-space: nowrap; }
    .summary-short { font-size: 13px; color: #555; line-height: 1.7; margin-bottom: 10px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    .expand-hint { font-size: 11px; color: #888; }
    .detail { display: none; border-top: 1px solid #eee; padding: 1.25rem; background: #fafafa; }
    .detail.open { display: block; }
    .detail-text { font-size: 13px; color: #333; line-height: 1.8; white-space: pre-wrap; margin-bottom: 1rem; }
    .detail-footer { display: flex; justify-content: space-between; align-items: center; }
    .btn-link { font-size: 12px; color: #1a73e8; text-decoration: none; }
    .actions { display: none; }
    .btn-post { font-size: 12px; padding: 6px 16px; background: #111; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    .btn-skip { font-size: 12px; padding: 6px 16px; background: transparent; color: #888; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; }
    .posted { opacity: 0.4; pointer-events: none; }
    .badge-posted { font-size: 11px; color: #22c55e; }
  </style>
</head>
<body>
  <div class="header">
    <h1>今日のニュース</h1>
    <span class="date" id="date"></span>
  </div>
  <div class="container" id="container"></div>

  <script>
    document.getElementById("date").textContent = new Date().toLocaleDateString("ja-JP", {year:"numeric",month:"long",day:"numeric",weekday:"short"});

    // JSONデータを直接埋め込む（後でPythonが自動生成）
    const articles = [
  {
    "title": "Parallel Web Systems hits $2B valuation five months after its last big raise",
    "url": "https://techcrunch.com/2026/04/29/parallel-web-systems-hits-2b-valuation-five-months-after-its-last-big-raise/",
    "source": "TechCrunch",
    "summary": "【3行要約】\n1. 元TwitterCEOのParag Agrawal氏が創業したAIエージェントツールスタートアップ「Parallel Web Systems」が、Sequoia主導で1億ドルの資金調達を実施した。\n2. 今回の調達は、前回の1億ドル調達からわずか数ヶ月後に行われたものである。\n3. この資金調達により、同社の評価額は200億ドル（約20億ドル）に達した。\n\n【背景・ポイント】\nParallel Web Systemsは、元Twitter（現X）CEOのParag Agrawal氏が設立したAIエージェントツール分野のスタートアップであり、短期間で連続的な大型調達を成功させている。わずか5ヶ月以内に合計2億ドルを調達し、評価額20億ドルを達成したことは、AIエージェント分野への投資家の強い関心と期待を示している。著名VCのSequoiaが主導したことも、同社への高い信頼を裏付けている。",
    "collected_at": "2026-04-29T20:12:30.915233"
  },
  {
    "title": "Google Photos uses AI to make the iconic closet from ‘Clueless’ a reality",
    "url": "https://techcrunch.com/2026/04/29/google-photos-uses-ai-to-make-the-iconic-closet-from-clueless-a-reality/",
    "source": "TechCrunch",
    "summary": "【3行要約】\n1. GoogleフォトがAI技術を活用した新機能を発表した。\n2. この機能は、ユーザーのGoogleフォトライブラリに写っている服をもとに、デジタルワードローブを自動作成する。\n3. 映画『クルーレス』の主人公が使っていた\"バーチャルクローゼット\"のような機能が現実になった形だ。\n\n【背景・ポイント】\n映画『クルーレス』（1995年）には、コンピューターで服のコーディネートを管理する印象的なシーンがあり、当時から憧れの的だった。今回のGoogle PhotosのAI機能はそのビジョンを現代技術で実現するもので、ユーザーは自分の写真から自動的に整理されたデジタルワードローブを持てるようになる。写真ライブラリを活用するため、新たに服を登録する手間なく自分の持ち服を把握できる点が特徴だ。",
    "collected_at": "2026-04-29T20:12:37.728863"
  },
  {
    "title": "More Gemini features are coming to Google TV",
    "url": "https://techcrunch.com/2026/04/29/more-gemini-features-are-coming-to-google-tv/",
    "source": "TechCrunch",
    "summary": "【3行要約】\n1. Google TVに新たなGeminiの機能が追加された。\n2. 「Nano Banana」と呼ばれるツールを使って写真を変換する機能が導入された。\n3. 動画生成AIツール「Veo」を活用した動画変換機能も利用可能になった。\n\n【背景・ポイント】\nGoogleはAIモデル「Gemini」をGoogle TVプラットフォームに統合し、エンターテインメント体験の強化を図っている。写真や動画をAIで変換・加工できる機能の追加により、テレビ視聴にとどまらないクリエイティブな用途への展開が期待される。GeminiをTVデバイスに組み込むことで、GoogleはリビングルームにおけるAI活用の幅を広げようとしている。",
    "collected_at": "2026-04-29T20:12:42.794803"
  }
];

    const container = document.getElementById("container");

    articles.forEach((article, i) => {
      const lines = article.summary.split("\n").filter(l => l.trim());
      const shortSummary = lines.slice(0, 3).join("\n");

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-main" onclick="toggle(${i})">
          <div class="card-top">
            <div class="title">${article.title}</div>
            <div class="source">${article.source}</div>
          </div>
          <div class="summary-short">${shortSummary}</div>
          <div class="card-footer">
            <span class="expand-hint" id="hint-${i}">詳細を見る ▾</span>
          </div>
        </div>
        <div class="detail" id="detail-${i}">
          <div class="detail-text">${article.summary}</div>
          <div class="detail-footer">
            <a class="btn-link" href="${article.url}" target="_blank">元記事を読む →</a>
            <div class="actions">
              <button class="btn-post" onclick="post(event, ${i})">投稿する</button>
              <button class="btn-skip" onclick="skip(event, ${i})">スキップ</button>
            </div>
          </div>
        </div>
      `;
      container.appendChild(card);
    });

    function toggle(i) {
      const detail = document.getElementById(`detail-${i}`);
      const hint = document.getElementById(`hint-${i}`);
      const isOpen = detail.classList.contains("open");
      detail.classList.toggle("open", !isOpen);
      hint.textContent = isOpen ? "詳細を見る ▾" : "詳細を閉じる ▴";
    }

    function post(e, i) {
      e.stopPropagation();
      const card = e.target.closest(".card");
      card.classList.add("posted");
      e.target.closest(".actions").innerHTML = '<span class="badge-posted">✓ 投稿済み</span>';
      alert("投稿しました！（X連携は次のステップで実装します）");
    }

    function skip(e, i) {
      e.stopPropagation();
      const card = e.target.closest(".card");
      card.classList.add("posted");
      e.target.closest(".actions").innerHTML = '<span style="font-size:11px;color:#888;">スキップ済み</span>';
    }
  </script>
</body>
</html>

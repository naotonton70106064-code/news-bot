AWS）での製品販売を可能にするため、最大株主のMicrosoftから重要な譲歩を獲得した。", "元DeepMind研究者のデビッド・シルバー氏が設立した英国のAIスタートアップ「Ineffable Intelligence」が、11億ドル（約1,650億円）の資金調達に成功した。"]}, {"date": "2026-04-26", "count": 3, "titles": ["「TechCrunch Mobility」は、交通・モビリティ分野の最新ニュースと洞察を届けるニュースレターである。", "サンフランシスコ北部のミル・バレーにある13エーカーの不動産が、珍しい条件で売りに出されている。", "SpeakOnが129ドルの音声文字起こし専用デバイスを発売し、MagSafeでiPhoneの背面に装着して使用する。"]}]}, {"key": "2026-04-19", "label": "2026年04/19〜04/25", "days": [{"date": "2026-04-25", "count": 3, "titles": ["OpenAIのCEOサム・アルトマンが、カナダのタンブラー・リッジの住民に謝罪の手紙を送った。", "原子力スタートアップのX-energyが株式公開（IPO）を果たした。", "カナダのAIスタートアップ「Cohere」が、ドイツの「Aleph Alpha」を買収・合併する。"]}, {"date": "2026-04-24", "count": 3, "titles": ["ComfyUIが3,000万ドル（約45億円）の資金調達を完了した。", "Xが「XChat」という新しいスタンドアロンアプリをiOS向けにリリースした。", "GoogleはAI企業Anthropicに最大400億ドル（約6兆円）を現金およびコンピューティングリソースで投資する計画を発表した。"]}, {"date": "2026-04-23", "count": 3, "titles": ["Instagramが「Instants」という新しいアプリのテストを開始した。", "「Noscroll」は、AIボットがユーザーの代わりにインターネットを読み巡るサービスです。", "トランプ大統領が米国サイバーセキュリティ機関CISAの長官候補として指名したショーン・プランキー氏が、指名辞退を申し出た。"]}, {"date": "2026-04-22", "count": 3, "titles": ["CursorはAI関連で今週20億ドルの資金調達ラウンドを締結する予定だった。", "フランスの国民ID・パスポートなどの発行・管理を担う政府機関がサイバー攻撃を受けた。", "Appleは、法執行機関が削除済みのSignalメッセージをiPhoneから復元できるバグを修正した。"]}]}], "weeklies": [{"id": "2026-W18", "filename": "it/weekly-2026-W18.html"}]}, "japan_economy": {"name": "日本経済", "weeks": [{"key": "2026-05-03", "label": "2026年05/03〜05/09", "days": [{"date": "2026-05-05", "count": 6, "titles": ["日経平均6万円突破と円安介入——過熱相場の「売り場」と150円割れへの攻防を徹底分析", "キャリア選択の新視点｜モチベーション4タイプ診断で「本当の満足」を得る転職術", "金田一耕助シリーズ第1作『本陣殺人事件』が漫画化──日本ミステリー文化のコンテンツ産業としての再評価"]}]}], "weeklies": []}, "world_economy": {"name": "世界経済", "weeks": [{"key": "2026-05-03", "label": "2026年05/03〜05/09", "days": [{"date": "2026-05-05", "count": 6, "titles": ["ギャップ共同創業者ドリス・フィッシャー氏が94歳で逝去―アメリカ小売業界の先駆者が残した遺産", "英国のパブが2026年に1日2軒ペースで閉店——飲食業界の構造的危機が深刻化", "ボーダフォン・フランチャイズ詐欺訴訟：62名の元加盟店オーナーが「夢を売られた」と集団提訴"]}]}], "weeklies": []}};
    let currentCategory = "it";
    let currentPage = 0;

    const weekdays = ["\u65E5", "\u6708", "\u706B", "\u6C34", "\u6728", "\u91D1", "\u571F"];

    function getArticlePath(category, date) {
      if (category === "it") {
        // 旧構造チェック: articles/直下にあるかカテゴリフォルダか
        const catData = categories[category];
        const weeks = catData.weeks;
        for (const w of weeks) {
          for (const d of w.days) {
            if (d.date === date) {
              // 新構造のファイルがあればカテゴリパス、なければ旧パス
              return "articles/it/" + date + ".html";
            }
          }
        }
      }
      return "articles/" + category + "/" + date + ".html";
    }

    function renderSidebar() {
      const container = document.getElementById("sidebar-content");
      const weeklies = categories[currentCategory].weeklies || [];
      if (weeklies.length === 0) {
        container.innerHTML = '<div class="sidebar-empty">まだありません</div>';
        return;
      }
      container.innerHTML = weeklies.map(w =>
        '<a href="articles/' + w.filename + '" class="sidebar-link">' + w.id + '</a>'
      ).join("");
    }

    function renderWeek() {
      const catData = categories[currentCategory];
      const weeks = catData.weeks;
      const container = document.getElementById("articles-container");

      if (!weeks || weeks.length === 0) {
        document.getElementById("week-label").textContent = catData.name;
        document.getElementById("btn-prev").disabled = true;
        document.getElementById("btn-next").disabled = true;
        container.innerHTML = '<div class="empty-message">\u307E\u3060\u8A18\u4E8B\u304C\u3042\u308A\u307E\u305B\u3093</div>';
        return;
      }

      if (currentPage >= weeks.length) currentPage = weeks.length - 1;
      if (currentPage < 0) currentPage = 0;

      const week = weeks[currentPage];
      document.getElementById("week-label").textContent = week.label;
      document.getElementById("btn-prev").disabled = (currentPage >= weeks.length - 1);
      document.getElementById("btn-next").disabled = (currentPage <= 0);

      container.innerHTML = "";

      week.days.forEach(day => {
        const dt = new Date(day.date + "T00:00:00");
        const wd = weekdays[dt.getDay()];
        const display = dt.getFullYear() + "\u5E74" + (dt.getMonth()+1) + "\u6708" + dt.getDate() + "\u65E5";

        let titlesHtml = day.titles.map(t => "<li>\u30FB" + t + "</li>").join("");
        if (day.count > 3) {
          titlesHtml += '<li class="more">...\u4ED6' + (day.count - 3) + '\u4EF6</li>';
        }

        const card = document.createElement("a");
        card.href = getArticlePath(currentCategory, day.date);
        card.className = "day-card";
        card.innerHTML = '<div class="day-date">' + display + '\uFF08' + wd + '\uFF09</div>'
          + '<div class="day-count">' + day.count + '\u4EF6\u306E\u8A18\u4E8B</div>'
          + '<ul class="day-titles">' + titlesHtml + '</ul>';
        container.appendChild(card);
      });
    }

    function switchCategory(cat) {
      currentCategory = cat;
      currentPage = 0;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.cat === cat);
      });
      renderSidebar();
      renderWeek();
    }

    function prevWeek() {
      const weeks = categories[currentCategory].weeks;
      if (currentPage < weeks.length - 1) {
        currentPage++;
        renderWeek();
      }
    }

    function nextWeek() {
      if (currentPage > 0) {
        currentPage--;
        renderWeek();
      }
    }

    // タブクリックイベント
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => switchCategory(btn.dataset.cat));
    });

    // 初期表示
    renderSidebar();
    renderWeek();
  </script>
</body>
</html>

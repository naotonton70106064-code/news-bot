          <button class="expand-btn" onclick="toggle(${i})" id="btn-${i}">詳細を見る ▾</button>
        </div>
        <div class="detail" id="detail-${i}">
          ${sections.join("")}
          <div class="detail-footer">
            <a class="btn-link" href="${article.url}" target="_blank">元記事を読む →</a>
            <div class="actions" id="actions-${i}">
              <button class="btn-post" onclick="post(event, ${i})">投稿する</button>
              <button class="btn-skip" onclick="skip(event, ${i})">スキップ</button>
            </div>
          </div>
        </div>
      `;
      container.appendChild(card);
    });

    function toggle(i) {
      const detail = document.getElementById(`detail-${i}`);
      const btn = document.getElementById(`btn-${i}`);
      const isOpen = detail.classList.contains("open");
      detail.classList.toggle("open", !isOpen);
      btn.textContent = isOpen ? "詳細を見る ▾" : "詳細を閉じる ▴";
    }

    function post(e, i) {
      e.stopPropagation();
      const card = e.target.closest(".card");
      card.classList.add("posted");
      document.getElementById(`actions-${i}`).innerHTML = '<span class="badge-posted">✓ 投稿済み</span>';
      alert("投稿しました！（X連携は次のステップで実装します）");
    }

    function skip(e, i) {
      e.stopPropagation();
      const card = e.target.closest(".card");
      card.classList.add("posted");
      document.getElementById(`actions-${i}`).innerHTML = '<span style="font-size:11px;color:#888;">スキップ済み</span>';
    }

    (function renderRelatedLinks() {
      if (!relatedLinks || typeof relatedLinks !== "object") return;
      const groups = [];

      const others = relatedLinks.otherCategories || [];
      if (others.length > 0) {
        const linksHTML = others
          .map(o => `<a class="related-link" href="${o.href}">同じ日の${o.name}を見る →</a>`)
          .join("");
        groups.push(`
          <div class="related-group">
            <div class="related-group-title">同じ日の他カテゴリ</div>
            <div class="related-links">${linksHTML}</div>
          </div>`);
      }

      const prev = relatedLinks.prevDate;
      const next = relatedLinks.nextDate;
      if (prev || next) {
        const navHTML = [
          prev ? `<a class="related-link" href="${prev.href}">← 前日の記事へ (${prev.date})</a>` : "",
          next ? `<a class="related-link" href="${next.href}">翌日の記事へ (${next.date}) →</a>` : "",
        ].filter(Boolean).join("");
        groups.push(`
          <div class="related-group">
            <div class="related-group-title">日付ナビ</div>
            <div class="related-nav-row">${navHTML}</div>
          </div>`);
      }

      const weekly = relatedLinks.weekly;
      if (weekly && weekly.href) {
        groups.push(`
          <div class="related-group">
            <div class="related-group-title">週次サマリー</div>
            <div class="related-links">
              <a class="related-link related-link-weekly" href="${weekly.href}">この週のまとめを見る (${weekly.id}) →</a>
            </div>
          </div>`);
      }

      if (groups.length === 0) return;
      const section = document.getElementById("related-section");
      const content = document.getElementById("related-content");
      content.innerHTML = groups.join("");
      section.style.display = "block";
    })();
  </script>
</body>
</html>

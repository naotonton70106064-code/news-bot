    const container = document.getElementById("container");

    function cleanText(text) {
  if (!text) return "";
  return text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

    function isValidTitle(t) {
      if (!t) return false;
      const s = String(t).trim();
      if (!s) return false;
      return !/^[-—ー―ｰ_=・\s]+$/.test(s);
    }

    function hasContent(t) {
      return !!(t && String(t).trim());
    }

    articles.forEach((article, i) => {
      const card = document.createElement("div");
      card.className = "card";

      const displayTitle = isValidTitle(article.japanese_title) ? article.japanese_title : article.title;

      const summaryHTML = (article.summary_lines || [])
        .map(l => `<div class="summary-line">${l}</div>`)
        .join("");

      const points = article.points || [];
      const pointsHTML = points
        .map(l => `<div class="detail-point">${l}</div>`)
        .join("");

      const sections = [];
      if (hasContent(article.background)) {
        sections.push(`
          <div class="detail-section">
            <div class="detail-label">背景・経緯</div>
            <div class="detail-text">${cleanText(article.background)}</div>
          </div>`);
      }
      if (hasContent(article.market_impact)) {
        sections.push(`
          <div class="detail-section">
            <div class="detail-label">市場への影響</div>
            <div class="detail-text">${cleanText(article.market_impact)}</div>
          </div>`);
      }

        sections.push(`

          </div>`);
      }
      if (hasContent(article.ai_interpretation)) {
        sections.push(`
          <div class="detail-section">
            <div class="ai-badge">AIの解釈</div>
            <div class="detail-text">${cleanText(article.ai_interpretation)}</div>
          </div>`);
      }

      card.innerHTML = `

    function toggle(i) {
      const detail = document.getElementById(`detail-${i}`);
      const btn = document.getElementById(`btn-${i}`);
      const isOpen = detail.classList.contains("open");
      detail.classList.toggle("open", !isOpen);
      btn.textContent = isOpen ? "詳細を見る ▾" : "詳細を閉じる ▴";
    }

    function post(e, i) {
      e.stopPropagation();
      const card = e.target.closest(".card");
      card.classList.add("posted");
      document.getElementById(`actions-${i}`).innerHTML = '<span class="badge-posted">✓ 投稿済み</span>';
      alert("投稿しました！（X連携は次のステップで実装します）");
    }

    function skip(e, i) {

      const card = e.target.closest(".card");
      card.classList.add("posted");
      document.getElementById(`actions-${i}`).innerHTML = '<span style="font-size:11px;color:#888;">スキップ済み</span>';
    }
